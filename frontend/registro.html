<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Glams Nails Spa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <main class="auth">
    <section class="auth-visual" aria-hidden="true">
      <div class="auth-cita">
        <blockquote>Guarda tus citas y recibe beneficios pensados para ti.</blockquote>
        <small>ÚNETE A GLAMS</small>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-caja">
        <img class="auth-logo" src="/img/logo.png" alt="Glams Nails Spa">
        <p class="eyebrow">Únete a Glams</p>
        <h1>Crea tu cuenta</h1>
        <p class="auth-intro">Solo toma un minuto.</p>

        <form id="form-registro" novalidate>
          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" maxlength="50" autocomplete="given-name" required>
          </div>
          <div class="campo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" maxlength="50" autocomplete="family-name" required>
          </div>
          <div class="campo">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" maxlength="20" autocomplete="tel" placeholder="+57 300 000 0000" required>
          </div>
          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" maxlength="100" autocomplete="username" placeholder="nombre@correo.com" required>
          </div>
          <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" maxlength="72" autocomplete="new-password" required>
            <span class="ayuda">De 8 a 72 caracteres, con una mayúscula y un número.</span>
          </div>
          <div class="campo">
            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" maxlength="72" autocomplete="new-password" required>
          </div>

          <label class="terminos">
            <input type="checkbox" id="terminos">
            <span>Acepto la política de tratamiento de datos personales.</span>
          </label>

          <p id="mensaje" class="mensaje" role="alert"></p>
          <button class="btn" type="submit" id="btn-enviar">Crear cuenta</button>
        </form>

        <p class="auth-pie">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
      </div>
    </section>
  </main>

  <script type="module" src="/js/paginas/registro.js"></script>
</body>
</html>
